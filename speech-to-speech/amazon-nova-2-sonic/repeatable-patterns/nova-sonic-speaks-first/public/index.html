<!DOCTYPE html>
<html>

<head>
    <title>Professora Carolina</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/style.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>

<body>
    <div id="app">
        <div style="text-align: center; margin-top: 20px;">
            <div style="font-size: 80px;">🙋‍♀️</div>
            <h1 style="margin: 10px 0;">Professora Carolina</h1>
        </div>
        <div id="status" class="disconnected">Disconnected</div>
        <div id="chat-container"></div>
        <div id="controls">
            <button id="start" class="button">Start Streaming</button>
            <button id="stop" class="button" disabled>Stop Streaming</button>
        </div>
        <div id="text-input-container">
            <input type="text" id="text-input" placeholder="Type a message and press Enter..." disabled />
            <button id="send-text" class="button" disabled>Send</button>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
